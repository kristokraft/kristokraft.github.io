<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kristokraft | DJ</title>
<meta name="description" content="Kristokraft. DJ sets, mixes and bookings.">
<meta property="og:title" content="Kristokraft | DJ">
<meta property="og:image" content="images/hero.jpg">

<script>
/* =====================================================================
   EDIT YOUR SITE HERE
   Change the text between the quotes. Save (Commit changes) and the
   site updates on its own in about a minute.
   ===================================================================== */
const SITE = {
  name: "KristoKraft",

  // Your bio. Each line in quotes is one paragraph.
  bio: [
    "KristoKraft offers a music buffet of groovy rhythms, funky day parties, melancholic tunes and industrial sounds.",
    "Each place and moment deserves its own soundtrack. KristoKraft's mission is to capture it and take dancefloors to places they didn't plan to visit, moving effortlessly between genres and moods."
  ],

  soundcloudProfile: "https://soundcloud.com/kristokraft",

  // SoundCloud tracks to embed. Paste the normal track link.
  // Add more by adding another line in quotes, separated by a comma.
  tracks: [
    "https://soundcloud.com/kristokraft/day-party-b2b-with-minna-yr"
  ],

  instagram: "https://www.instagram.com/djkristokraft/",

  // Instagram reels or posts to embed as videos. Paste the link to a
  // public reel, e.g. "https://www.instagram.com/reel/ABC123/".
  // Leave the list empty [] to hide the section.
  instagramVideos: [
    // "https://www.instagram.com/p/Dbf89ayI0K0/"
  ],

  // Booking email. Leave "" to hide the booking button.
  email: "brkristoffer@gmail.com",

  // Upcoming gigs. Leave the list empty [] to hide the section.
  gigs: [
    // { date: "Oct 12", venue: "Venue name", city: "City", link: "" },
  ],

  // Photos in the images folder.
  photos: ["images/hero.jpg", "images/smoke.jpg", "images/green.jpg"]
};
/* ===================================================================== */
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #07060b;
    --panel: #111019;
    --line: #26232f;
    --text: #f3f1f7;
    --muted: #a19dab;
    --orange: #ffa53a;
    --pink: #ff4fd8;
    --cyan: #4fe3ff;
    --green: #3dff78;
    --gutter: clamp(16px, 4vw, 48px);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; }
  img { display: block; max-width: 100%; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 var(--gutter); }

  /* ---------- page 1 ---------- */
  .hero {
    position: relative;
    min-height: 100vh; min-height: 100svh;
    padding: clamp(20px, 4vh, 40px) 0 clamp(24px, 5vh, 48px);
    display: flex; flex-direction: column;
  }
  .hero::before {
    content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(40% 40% at 80% 60%, rgba(58,60,255,.30), transparent 70%),
      radial-gradient(35% 35% at 10% 90%, rgba(255,79,216,.16), transparent 70%);
  }
  h1 {
    font: 800 11vw/1 Unbounded, sans-serif;
    margin: 0 0 clamp(16px, 3vh, 32px);
    letter-spacing: -.03em;
    white-space: nowrap; align-self: flex-start; max-width: none;
    background: linear-gradient(95deg, var(--orange), var(--pink) 55%, var(--cyan));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero-grid {
    flex: 1;
    display: grid; grid-template-columns: 1.25fr 1fr;
    gap: clamp(20px, 3vw, 48px); align-items: stretch;
  }
  .hero-left { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
  .sc { display: grid; gap: 12px; }
  .sc iframe { width: 100%; height: 166px; border: 0; border-radius: 14px; background: #f2f2f2;
    filter: invert(1) hue-rotate(180deg); /* turns SoundCloud's light player dark */ }
  .bio p { font-size: 17px; color: #d6d3dd; margin: 0 0 12px; max-width: 58ch; }
  .buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: auto; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 20px; border-radius: 999px; text-decoration: none;
    font-weight: 600; font-size: 15px; border: 1px solid var(--line);
    transition: transform .15s, border-color .15s;
  }
  .btn:hover { transform: translateY(-2px); border-color: var(--text); }
  .btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn svg { width: 18px; height: 18px; }
  .hero-photo { min-height: 0; position: relative; }
  .hero-photo img {
    width: 100%; height: 100%; max-height: 70vh; min-height: 320px;
    object-fit: cover; object-position: center 25%;
    border-radius: 20px; box-shadow: 0 30px 80px -24px rgba(58,60,255,.6);
  }
  @media (max-width: 860px) {
    .hero { min-height: 0; }
    .hero-grid { grid-template-columns: 1fr; }
    .hero-photo img { max-height: 60vh; aspect-ratio: 4/5; height: auto; }
    .buttons { margin-top: 0; }
  }

  /* ---------- page 2 ---------- */
  .page2 { padding: clamp(40px, 8vh, 80px) 0 32px; }
  h2 {
    font: 800 clamp(24px, 3.5vw, 36px)/1 Unbounded, sans-serif;
    margin: 0 0 20px; letter-spacing: -.02em;
  }
  h2 span { color: var(--green); }
  .p2-grid { display: grid; grid-template-columns: minmax(0, 420px) 1fr; gap: clamp(20px, 3vw, 40px); align-items: start; }
  .p2-grid.no-ig { grid-template-columns: 1fr; }
  .ig .instagram-media { min-width: 0 !important; width: 100% !important; margin: 0 0 16px !important; border-radius: 14px !important; }
  .photos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .photos img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 14px; }
  .gigs { list-style: none; margin: 24px 0 0; padding: 0; border-top: 1px solid var(--line); }
  .gigs li { display: grid; grid-template-columns: 90px 1fr auto; gap: 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .gigs .date { font: 500 14px Unbounded, sans-serif; color: var(--cyan); }
  .gigs .venue { font-weight: 600; }
  .gigs .city { color: var(--muted); font-size: 14px; }
  .book {
    margin-top: 24px; padding: 24px; border: 1px solid var(--line); border-radius: 20px;
    background: radial-gradient(60% 100% at 0% 0%, rgba(255,79,216,.14), transparent 70%), var(--panel);
  }
  .book h2 { margin-bottom: 8px; }
  .book p { color: var(--muted); margin: 0 0 18px; }
  .more { color: var(--muted); font-size: 14px; margin: 0; }
  .more a { color: var(--orange); }
  footer { padding: 24px 0 40px; color: var(--muted); font-size: 13px; text-align: center; }
  @media (max-width: 760px) { .p2-grid { grid-template-columns: 1fr; } }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap" style="display:flex;flex-direction:column;flex:1;width:100%">
    <h1 id="name">Kristokraft</h1>
    <div class="hero-grid">
      <div class="hero-left">
        <div class="sc" id="tracks"></div>
        <div class="bio" id="bio"></div>
        <div class="buttons">
          <a class="btn primary" id="btn-mail">Book me</a>
          <a class="btn" id="btn-ig" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
            Instagram
          </a>
          <a class="btn" id="btn-sc" target="_blank" rel="noopener">SoundCloud</a>
        </div>
      </div>
      <div class="hero-photo"><img id="hero-img" alt="Kristokraft behind the decks"></div>
    </div>
  </div>
</header>

<section class="page2">
  <div class="wrap">
    <div class="p2-grid" id="p2">
      <div class="ig" id="watch">
        <h2>Watch<span>.</span></h2>
        <div id="ig"></div>
        <p class="more">More clips on <a id="ig-more" target="_blank" rel="noopener">Instagram</a>.</p>
      </div>
      <div>
        <div class="photos" id="photos"></div>
        <div id="gigs-section">
          <ul class="gigs" id="gigs"></ul>
        </div>
        <div class="book" id="book">
          <h2>Book me<span>.</span></h2>
          <p>Clubs, private events, day parties. Send the date, place and vibe.</p>
          <div class="buttons">
            <a class="btn primary" id="btn-mail2">Email me</a>
            <a class="btn" id="btn-dm" target="_blank" rel="noopener">DM on Instagram</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<footer><span id="copy"></span></footer>

<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const clean = u => u.split('?')[0];

  document.title = SITE.name + " | DJ";
  $("name").textContent = SITE.name;
  $("copy").textContent = "© " + new Date().getFullYear() + " " + SITE.name;

  // make the name fill the width on one line
  function fitName() {
    const h = $("name"), box = h.parentElement;
    const avail = box.clientWidth - parseFloat(getComputedStyle(box).paddingLeft) - parseFloat(getComputedStyle(box).paddingRight);
    h.style.fontSize = "100px";
    const size = Math.min(100 * avail / h.scrollWidth, 260);
    h.style.fontSize = Math.floor(size * 0.99) + "px";
  }
  fitName();
  window.addEventListener("resize", fitName);
  if (document.fonts) document.fonts.ready.then(fitName);

  ["btn-ig", "ig-more", "btn-dm"].forEach(id => $(id).href = SITE.instagram);
  $("btn-sc").href = SITE.soundcloudProfile;

  // photos
  $("hero-img").src = SITE.photos[0];
  $("photos").innerHTML = SITE.photos.slice(1, 3).map(p => `<img src="${esc(p)}" alt="${esc(SITE.name)} live" loading="lazy">`).join("");

  // soundcloud
  $("tracks").innerHTML = SITE.tracks.map(t =>
    `<iframe loading="lazy" allow="autoplay" title="SoundCloud player"
      src="https://w.soundcloud.com/player/?url=${encodeURIComponent(clean(t))}&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false&show_artwork=false&visual=false"></iframe>`
  ).join("");

  // instagram
  if (SITE.instagramVideos.length) {
    $("ig").innerHTML = SITE.instagramVideos.map(u =>
      `<blockquote class="instagram-media" data-instgrm-permalink="${esc(clean(u))}" data-instgrm-version="14"><a href="${esc(clean(u))}" target="_blank" rel="noopener">Watch on Instagram</a></blockquote>`
    ).join("");
    const s = document.createElement("script");
    s.async = true; s.src = "https://www.instagram.com/embed.js";
    document.body.appendChild(s);
  } else {
    $("watch").classList.add("hidden");
    $("p2").classList.add("no-ig");
  }

  // bio
  $("bio").innerHTML = SITE.bio.map(p => `<p>${esc(p)}</p>`).join("");

  // gigs
  if (SITE.gigs.length) {
    $("gigs").innerHTML = SITE.gigs.map(g => `
      <li><span class="date">${esc(g.date)}</span>
      <span><div class="venue">${esc(g.venue)}</div><div class="city">${esc(g.city || "")}</div></span>
      ${g.link ? `<a class="btn" href="${esc(g.link)}" target="_blank" rel="noopener">Tickets</a>` : "<span></span>"}</li>`).join("");
  } else {
    $("gigs-section").classList.add("hidden");
  }

  // booking
  if (SITE.email) {
    const mail = "mailto:" + SITE.email + "?subject=" + encodeURIComponent("Booking inquiry");
    $("btn-mail").href = mail; $("btn-mail2").href = mail;
  } else {
    $("btn-mail").classList.add("hidden"); $("btn-mail2").classList.add("hidden");
  }
</script>
</body>
</html>
